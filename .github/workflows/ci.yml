name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端（ruff + pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 静态检查
        run: ruff check .

      - name: 单元测试 + 覆盖率
        # 阈值设为 80（当前 86%）：允许小幅波动，但阻止覆盖率明显回退
        run: pytest tests/ -q --cov --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: 前端（tsc + vite build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与构建
        run: npm run build
