# pytest 配置（v1.9.0）
#
# 默认跳过 network 标记的测试：它们会真实访问 github.com / bing.com，
# 在 CI 里既慢又不稳定（对方限流或改版就会红），不适合当必过门禁。
#
#   pytest tests/                 只跑离线测试（默认，CI 用这个）
#   pytest tests/ -m network      只跑真实网络 e2e
#   pytest tests/ -m ""           全部跑
#
# 这也让 tasks.md 的 T15（端到端全链路测试）从「待补」变成「可执行、按需运行」。

[pytest]
testpaths = tests
addopts = -m "not network" --strict-markers
markers =
    network: 需要真实网络访问（GitHub / 搜索引擎）。默认跳过，用 `-m network` 显式运行。
